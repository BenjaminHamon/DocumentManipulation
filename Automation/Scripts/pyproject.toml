# cspell:words asyncio pyinstaller pyright pylint pytest setuptools

[build-system]
requires = [ "setuptools >= 64" ]
build-backend = "setuptools.build_meta"

[project]
name = "automation-scripts"
version = "1.0.0+development"
description = "Automation scripts for the local project"
requires-python = ">= 3.11"

authors = [
    { name = "Benjamin Hamon", email = "development@benjaminhamon.com" }
]

maintainers = [
    { name = "Benjamin Hamon", email = "development@benjaminhamon.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "bhamon-development-toolkit[python] ~= 3.1.1",
    "requests ~= 2.32.5",
]

[project.optional-dependencies]
dev = [
    "mockito ~= 1.5.4",
    "pyright ~= 1.1.404",
]

[project.urls]
"Source" = "https://github.com/BenjaminHamon/DocumentManipulation"

[project.scripts]
automation = "automation_scripts.run_command:main"
